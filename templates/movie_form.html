{% extends 'base.html' %}{% block title %}{{ page_title }}{% endblock %}{% block content %}
<div class="page-title-row"><div><div class="eyebrow">CATALOGUE MANAGEMENT</div><h1>{{ page_title }}<span>.</span></h1><p class="muted">Keep the movie information accurate and up to date.</p></div></div>
<form method="post" class="editor-card"><div class="form-grid"><label class="wide">Movie title *<input name="title" required value="{{ movie.title if movie else '' }}"></label><label>Language<input name="language" value="{{ movie.language if movie else 'Tamil' }}"></label><label>Genre<input name="genre" value="{{ movie.genre if movie else '' }}"></label><label>Director<input name="director" value="{{ movie.director if movie else '' }}"></label><label>Cast members<input name="cast_members" value="{{ movie.cast_members if movie else '' }}"></label><label>Release year<input type="number" name="release_year" min="1888" max="2100" value="{{ movie.release_year if movie and movie.release_year else '' }}"></label><label>Duration (minutes)<input type="number" name="duration_minutes" min="1" value="{{ movie.duration_minutes if movie and movie.duration_minutes else '' }}"></label><label>Rating (0–10)<input type="number" name="rating" min="0" max="10" step="0.1" value="{{ movie.rating if movie else '0.0' }}"></label><label class="wide">Synopsis<textarea name="synopsis" rows="5">{{ movie.synopsis if movie else '' }}</textarea></label></div><div class="form-actions"><a class="btn ghost" href="{{ url_for('movies') }}">Cancel</a><button class="btn primary">Save movie</button></div></form>{% endblock %}
