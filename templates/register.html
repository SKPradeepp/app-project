{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}
<section class="auth-card"><div class="eyebrow">JOIN THE COMMUNITY</div><h1>Create your<br><span>account.</span></h1><p class="muted">Your personal space for discovering Tamil movies.</p>
<form method="post" class="form-stack"><label>Full name<input name="full_name" placeholder="Your name" required></label><label>Email address<input type="email" name="email" placeholder="you@example.com" required></label><label>Password<input type="password" name="password" minlength="6" placeholder="At least 6 characters" required></label><button class="btn primary full">Create account <span>→</span></button></form>
<p class="auth-bottom">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
